const list = document.getElementById('list');
const search = document.getElementById('search');
const count = document.getElementById('count');

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render() {
  const q = search.value.trim().toLocaleLowerCase('no-NO');
  const filtered = products.filter(p =>
    !q || [p.produkt,p.produsent,p.type].some(v => String(v||'').toLocaleLowerCase('no-NO').includes(q))
  );
  const groups = {};
  for (const p of filtered) {
    const g = p.produsent || 'Ukjent produsent';
    (groups[g] ||= []).push(p);
  }
  count.textContent = filtered.length + ' produkter';
  list.innerHTML = Object.keys(groups).sort((a,b)=>a.localeCompare(b,'no')).map(g => `
    <section class="group">
      <h2>${esc(g)}</h2>
      ${groups[g].map(p => `
        <div class="item">
          <strong>${esc(p.produkt)}</strong>
          <div class="meta">${esc(p.type || '')}</div>
          ${p.sds ? `<a class="btn" href="${esc(p.sds)}" target="_blank" rel="noopener">ÅPNE SIKKERHETSDATABLAD</a>` :
             p.fil ? `<div class="missing">SDS-fil registrert: ${esc(p.fil)}</div>` :
             `<div class="missing">Sikkerhetsdatablad ikke koblet ennå</div>`}
        </div>`).join('')}
    </section>`).join('');
}
search.addEventListener('input', render);
render();
